name: Kit pin bump

# This kit is a CONSUMER of exactly one @jfs pin: `dependencies.@jfs/vendor-cli`.
# That pin is load-bearing for the whole family — bin/vendor.mjs is a shim that
# runs whatever vendor-cli resolves from INSIDE this package, so the CLI every
# consumer's `jfs-news-kit-vendor` executes is decided here, not in the
# consumer's tree. It is also the one @jfs pin in the family that nothing
# bumped: kits don't normally carry this workflow, so the pin sat at 0.13.0
# while vendor-cli moved on, with no CI signal either way.
#
# The flow lives in the family's reusable workflow in vendor-cli; this stub
# keeps only the schedule and this repo's shape. No vendor:sync (this kit
# vendors nothing) and no version bump (a kit's semver tracks ITS shipped
# surface — index.js and bin — which a vendor-cli pin bump does not touch;
# family CI's version guard watches exactly those paths and would object).
on:
  schedule:
    - cron: '41 6 * * 1'   # Mondays ~06:41 UTC, with the rest of the family
  workflow_dispatch:

permissions:
  contents: write        # the caller must grant both — a called
  pull-requests: write   # workflow can't elevate its token

jobs:
  bump:
    uses: jsvolos63/vendor-cli/.github/workflows/kit-pin-bump.yml@main
    with:
      # No lockfile in this repo (the one dependency is a github pin), so
      # `npm ci` has nothing to read.
      install-command: npm install
      vendor-sync-command: ''
      version-bump-command: ''
      # EXACTLY the checks test.yml runs — test/repo.test.js fails when
      # the two blocks differ. The bump's merge is a GITHUB_TOKEN push, which
      # fires no workflows, so this is the only validation a bump gets before
      # it lands on main. It used to omit `npm run lint` on the theory that a
      # vendor-cli pin bump cannot change index.js; but the install above
      # resolves eslint's floating range fresh (no lockfile here), so a new
      # eslint minor could redden lint and the bump would still merge green.
      # test/vendor.test.js drives the pinned CLI's generator, so a vendor-cli
      # bump that would change what consumers vendor fails HERE rather than in
      # the consumers' `vendor:sync`.
      check-command: |
        node --check index.js
        npm run lint
        npm run policy:check
        npm test
